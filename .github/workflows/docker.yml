name: Publish Docker image

on:
  push:
    branches:
      - main

jobs:
  push_to_registry:
    name: Push Docker image to ECR and Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Build and push Docker image
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ECR_REPO: 244530008913.dkr.ecr.eu-west-1.amazonaws.com/wishifai-0501
        run: |
          aws ecr get-login-password --region eu-west-1 | docker login --username AWS --password-stdin 244530008913.dkr.ecr.eu-west-1.amazonaws.com
          echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

          rev=$(git rev-parse --short HEAD)
          docker build . -t wishifai

          docker tag wishifai $ECR_REPO:$rev
          docker tag wishifai $ECR_REPO:latest
          docker push $ECR_REPO:$rev
          docker push $ECR_REPO:latest


          docker tag wishifai $DOCKERHUB_USERNAME/wishifai:$rev
          docker tag wishifai $DOCKERHUB_USERNAME/wishifai:latest
          docker push $DOCKERHUB_USERNAME/wishifai:$rev
          docker push $DOCKERHUB_USERNAME/wishifai:latest




