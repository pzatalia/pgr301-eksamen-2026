name: Publish Docker image

on:
  push:
    branches:
      - main

jobs:
  push_to_registry:
    name: Push Docker image to ECR and Docker Hub
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.build.outputs.rev}}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Build and push Docker image
        id: build
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ECR_REPO: 244530008913.dkr.ecr.eu-west-1.amazonaws.com/wishifai-0501
        run: |
          aws ecr get-login-password --region eu-west-1 | docker login --username AWS --password-stdin 244530008913.dkr.ecr.eu-west-1.amazonaws.com
          echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

          rev=$(git rev-parse --short HEAD)
          docker build . -t wishifai

          docker tag wishifai $ECR_REPO:$rev
          docker tag wishifai $ECR_REPO:latest
          docker push $ECR_REPO:$rev
          docker push $ECR_REPO:latest


          docker tag wishifai $DOCKERHUB_USERNAME/wishifai:$rev
          docker tag wishifai $DOCKERHUB_USERNAME/wishifai:latest
          docker push $DOCKERHUB_USERNAME/wishifai:$rev
          docker push $DOCKERHUB_USERNAME/wishifai:latest

          echo "rev=$rev" >> "$GITHUB_OUTPUT"

  deploy:
      name: Terraform apply
      needs: push_to_registry
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - uses: aws-actions/configure-aws-credentials@v4
          with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: eu-west-1

        - uses: hashicorp/setup-terraform@v3
          with:
            terraform_version: 1.9.5
        
        - name: terraform fmt
          working-directory: infra
          run: terraform fmt -check -recursive

        - name: terraform init
          working-directory: infra
          run: terraform init -input=false

        - name: terraform apply
          working-directory: infra
          env:
            IMAGE_TAG: ${{ needs.push_to_registry.outputs.image_tag }}
          run: terraform apply -auto-approve -input=false -var "image_tag=$IMAGE_TAG"




